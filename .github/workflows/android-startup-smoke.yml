name: Android Startup Smoke Test
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            # Install directly and capture Android runtime errors BEFORE the tests.
            gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.vortex.retrocamera android.permission.CAMERA
            adb logcat -c
            adb shell am start -n com.vortex.retrocamera/.MainActivity
            sleep 7
            if ! adb shell pidof com.vortex.retrocamera; then
              echo "Startup crash — complete Android error log follows"
              adb logcat -d -v time | grep -A 65 -B 8 -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.vortex.retrocamera' || true
              exit 1
            fi
            adb shell screencap -p /sdcard/vortex-premium-collapsed.png
            adb pull /sdcard/vortex-premium-collapsed.png vortex-premium-collapsed.png
            adb shell uiautomator dump /sdcard/vortex-window.xml
            adb pull /sdcard/vortex-window.xml vortex-window.xml
            python3 -c 'import re,xml.etree.ElementTree as ET,subprocess; r=ET.parse("vortex-window.xml").getroot(); n=next((n for n in r.iter("node") if n.get("content-desc")=="Abrir filtros retrô"),None); assert n is not None,"Retro filter action is missing"; p=list(map(int,re.findall(r"\\d+",n.get("bounds")))); subprocess.run(["adb","shell","input","tap",str((p[0]+p[2])//2),str((p[1]+p[3])//2)],check=True)'
            sleep 2
            adb shell screencap -p /sdcard/vortex-premium-expanded.png
            adb pull /sdcard/vortex-premium-expanded.png vortex-premium-expanded.png
            if ! gradle --no-daemon :app:connectedDebugAndroidTest; then
              echo "Instrumentation failure; Android runtime logs:"
              adb logcat -d -v time | grep -A 55 -B 8 -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.vortex.retrocamera' || true
              exit 1
            fi
      - name: Upload camera layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-premium-ui-screenshot
          path: vortex-premium-*.png
          if-no-files-found: ignore
