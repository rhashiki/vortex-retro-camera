name: Android Startup Smoke Test
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            # connectedDebugAndroidTest removes test-installed APKs. Reinstall the
            # app explicitly before capturing a screenshot.
            gradle --no-daemon :app:installDebug
            adb shell pm grant com.vortex.retrocamera android.permission.CAMERA
            adb shell am start -n com.vortex.retrocamera/.MainActivity
            sleep 5
            adb shell pidof com.vortex.retrocamera
            adb shell screencap -p /sdcard/vortex-premium-collapsed.png
            adb pull /sdcard/vortex-premium-collapsed.png vortex-premium-collapsed.png
            adb shell uiautomator dump /sdcard/vortex-window.xml
            adb pull /sdcard/vortex-window.xml vortex-window.xml
            python3 -c 'import re,xml.etree.ElementTree as ET,subprocess; r=ET.parse("vortex-window.xml").getroot(); n=next((n for n in r.iter("node") if n.get("content-desc")=="Selecionar película fotográfica"),None); assert n is not None,"Filter toggle is missing"; p=list(map(int,re.findall(r"\\d+",n.get("bounds")))); subprocess.run(["adb","shell","input","tap",str((p[0]+p[2])//2),str((p[1]+p[3])//2)],check=True)'
            sleep 2
            adb shell screencap -p /sdcard/vortex-premium-expanded.png
            adb pull /sdcard/vortex-premium-expanded.png vortex-premium-expanded.png
      - name: Upload camera layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-premium-ui-screenshot
          path: vortex-premium-*.png
          if-no-files-found: ignore
