name: Android Startup Smoke Test
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell pm grant com.vortex.retrocamera android.permission.CAMERA || true
            adb shell am start -n com.vortex.retrocamera/.MainActivity
            sleep 4
            adb shell screencap -p /sdcard/vortex-premium-layout.png
            adb pull /sdcard/vortex-premium-layout.png vortex-premium-layout.png
      - name: Upload camera layout screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vortex-premium-ui-screenshot
          path: vortex-premium-layout.png
          if-no-files-found: ignore
